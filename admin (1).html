<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oybek Osh — админ</title>
<style>
:root{--ink:#140a07;--card:#24130c;--line:#3a2418;--saf:#ff8b1e;--cream:#f7ead3;--mute:#b3a08a;--ok:#4cd964;--bad:#e5482f}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font:500 15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
button,input,select{font:inherit;color:inherit}
button{border:0;background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700}
button:active{transform:scale(.95)}button.p{background:var(--saf);color:#1b0e00;border-color:var(--saf)}button.g{background:var(--ok);color:#06210b;border-color:var(--ok)}button.r{color:var(--bad)}
input,select{background:#1b0e08;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;font-size:15px}
.w{max-width:980px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:rgba(20,10,7,.96);border-bottom:1px solid var(--line);padding:10px 0}
.tabs{display:flex;gap:8px;overflow-x:auto}.tabs button.on{background:var(--cream);color:#1b0e00}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1 1 140px!important}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;background:#3a2418}
.s0{background:#2d4a8a}.s1{background:#8a5a14}.s2{background:#6a3a8a}.s3{background:#1f6a33}.s4{background:#7a2a1c}
.mu{color:var(--mute);font-size:13px}.big{font-size:26px;font-weight:800}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:800;border-top:2px solid var(--saf)}
.th{width:64px;height:64px;border-radius:12px;background:#1b0e08 center/cover;border:1px dashed var(--mute);display:grid;place-items:center;cursor:pointer;font-size:22px}
.mi{display:grid;grid-template-columns:64px 1fr;gap:10px}.mi.out{opacity:.7}
#login{max-width:340px;margin:18vh auto;padding:0 14px}
.hide{display:none!important}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#000}.c{border:1px solid #999;background:#fff}th,td{border-color:#999}.mu{color:#444}}
</style></head><body>
<div id="login"><h2>Oybek Osh · админ</h2><input id="pw" type="password" placeholder="Парол" autocomplete="current-password"><p id="le" style="color:var(--bad)"></p><button class="p" style="width:100%" onclick="login()">Кириш</button></div>
<div id="app" class="hide">
<header><div class="w tabs"><button data-t="o" class="on">📋 Буюртмалар <span id="nb"></span></button><button data-t="m">🍽 Меню</button><button data-t="r">📊 Ҳисобот</button><button data-t="u">👥 Мижозлар</button><button data-t="w">🧑‍🍳 Ишчилар</button></div></header>
<main class="w">
<section id="t-o"><div class="c row noprint"><input type="date" id="od" class="grow"><select id="of" class="grow"><option value="a">Ҳаммаси</option><option value="n">Янги / жараёнда</option><option value="3">Етказилган</option><option value="4">Бекор қилинган</option></select></div><div id="ol"></div></section>
<section id="t-m" class="hide"><div class="c row noprint"><button class="p" onclick="addM()">+ Таом қўшиш</button><button class="g" id="sv" onclick="saveM()">Сақлаш</button><span class="mu" id="sm">Ўзгартиришдан кейин «Сақлаш» ни босинг</span></div><div id="ml"></div><datalist id="cl"></datalist><input type="file" id="fi" accept="image/*" class="hide"></section>
<section id="t-u" class="hide"><div id="ul"></div></section>
<section id="t-w" class="hide"><div id="wl"></div></section>
<section id="t-r" class="hide"><div class="c row noprint"><input type="date" id="rf" class="grow"><input type="date" id="rt" class="grow"><button class="p" onclick="rep()">Ҳисоблаш</button><button onclick="day()">Бугун</button></div><div id="rp"></div></section>
</main></div>
<script>
const $=i=>document.getElementById(i),ST=["Қабул қилинди","Тайёрланмоқда","Етказилмоқда","Етказилди","Бекор қилинди"],EM=["✅","👨‍🍳","🛵","🏠","❌"];
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g," ")+" сўм",esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let TGD=decodeURIComponent((location.hash.match(/tg=([^&]*)/)||[])[1]||""),PW=sessionStorage.getItem("pw")||"",M=[],dirty=false,last=-1;
const api=async(p,b)=>{const r=await fetch("/api/admin/"+p,{method:b?"POST":"GET",headers:{"x-admin":PW,"x-tg":TGD,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});if(r.status===401){sessionStorage.removeItem("pw");if(TGD){TGD="";$("login").classList.remove("hide");$("app").classList.add("hide")}else location.reload();throw 0}if(!r.ok)throw new Error((await r.json()).e);return r.json()};
async function login(){PW=$("pw").value;try{await api("ping");sessionStorage.setItem("pw",PW);start()}catch(e){$("le").textContent="Парол нотўғри ёки сервер жавоб бермаяпти"}}
$("pw").onkeydown=e=>{if(e.key==="Enter")login()};
const ds=d=>{const z=new Date(d);return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0")};
const rng=(a,b)=>[new Date(a+"T00:00:00").getTime(),new Date(b+"T23:59:59.999").getTime()];
async function start(){$("login").classList.add("hide");$("app").classList.remove("hide");$("od").value=$("rf").value=$("rt").value=ds(Date.now());
 M=await (await fetch("/api/menu")).json();drawM();ord();setInterval(()=>{if(!document.hidden&&!$("t-o").classList.contains("hide"))ord()},8000)}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));["o","m","r","u","w"].forEach(k=>$("t-"+k).classList.toggle("hide",k!==b.dataset.t));if(b.dataset.t==="r")rep();if(b.dataset.t==="o")ord();if(b.dataset.t==="u")usr();if(b.dataset.t==="w")stf()}
async function stf(){const j=await api("staff");$("wl").innerHTML=`<div class="c"><b>Ишчилар: ${j.staff.length+j.env.length}</b><p class="mu" style="margin:6px 0 0">Ишчи ботга кириб <b>/login ПАРОЛ</b> ёзса (ёки фақат паролни ёзса), шу ерга қўшилади ва буюртмалар унга келади.</p></div>`+j.env.map(i=>`<div class="c row"><b class="grow">ID ${esc(i)}</b><span class="mu">Render да белгиланган</span></div>`).join("")+j.staff.map(x=>`<div class="c row"><b class="grow">${esc(x.name)}</b><span class="mu">${ds(x.t)}</span><button class="r" onclick="if(confirm('Ўчирайми?'))rmS(${x.id})">Ўчириш</button></div>`).join("")}
async function rmS(id){await api("staff",{id});stf()}
async function usr(){const L=await api("users");$("ul").innerHTML=`<div class="c"><b>Рўйхатдан ўтганлар: ${L.length}</b></div>`+L.map(u=>`<div class="c row"><b class="grow">${esc(u.name)}</b><a style="color:var(--saf)" href="tel:${esc(u.phone.replace(/[^+\d]/g,""))}">${esc(u.phone)}</a><span class="mu">${ds(u.t)} · буюртма: ${u.n}</span></div>`).join("")};
/* --- buyurtmalar --- */
$("od").onchange=$("of").onchange=()=>ord();
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch(e){}}
async function ord(){const[f,t]=rng($("od").value,$("od").value);let L=await api(`orders?from=${f}&to=${t}`);
 const act=L.filter(o=>o.s<3).length;$("nb").textContent=act?`(${act})`:"";if(last>=0&&L.length>last&&$("od").value===ds(Date.now()))beep();if($("od").value===ds(Date.now()))last=L.length;
 const fl=$("of").value;if(fl==="n")L=L.filter(o=>o.s<3);else if(fl!=="a")L=L.filter(o=>o.s==fl);
 $("ol").innerHTML=L.length?L.map(card).join(""):'<p class="mu">Буюртма йўқ</p>'}
const card=o=>`<div class="c"><div class="row"><b>№${o.id}</b><span class="mu">${new Date(o.t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</span><span class="tag s${o.s}">${EM[o.s]} ${ST[o.s]}</span><span class="grow"></span><b>${fmt(o.total)}</b></div>
<p style="margin:8px 0">${o.items.map(i=>`${esc(i.n)} × <b>${i.q}</b>`).join(" · ")}<br><span class="mu">Таомлар ${fmt(o.sum)} + етказиш ${fmt(o.fee)}</span></p>
<p style="margin:6px 0">👤 ${esc(o.name)} · <a style="color:var(--saf)" href="tel:${esc(o.phone.replace(/[^+\d]/g,""))}">${esc(o.phone)}</a><br>📍 ${esc(o.address)}${o.landmark?`<br>🧭 ${esc(o.landmark)}`:""}</p>
<div class="row">${[1,2,3].map(k=>`<button class="${o.s+1===k?"p":""}" ${o.s>=3?"disabled":""} onclick="st(${o.id},${k})">${EM[k]} ${ST[k]}</button>`).join("")}${o.s<3?`<button class="r" onclick="if(confirm('Бекор қилайми?'))st(${o.id},4)">❌ Бекор</button>`:o.s===4?`<button onclick="st(${o.id},0)">↩ Қайтариш</button>`:""}</div></div>`;
async function st(id,s){await api("status",{id,s});ord()}
/* --- menyu --- */
function drawM(){$("cl").innerHTML=[...new Set(M.map(x=>x.c))].map(c=>`<option value="${esc(c)}">`).join("");
 $("ml").innerHTML=M.map((x,i)=>`<div class="c mi${x.out?" out":""}"><div class="th" style="background-image:url(${esc(x.img)})" onclick="pic(${i})">${x.img?"":"📷"}</div><div>
<div class="row"><input class="grow" value="${esc(x.n)}" placeholder="Номи" oninput="ch(${i},'n',this.value)"><input class="grow" value="${esc(x.c)}" list="cl" placeholder="Категория" oninput="ch(${i},'c',this.value)"></div>
<input style="margin:8px 0" value="${esc(x.d)}" placeholder="Тавсиф" oninput="ch(${i},'d',this.value)">
<div class="row"><input class="grow" type="number" inputmode="numeric" value="${x.p}" oninput="ch(${i},'p',+this.value)"><button class="${x.out?"r":""}" onclick="ch(${i},'out',!M[${i}].out);drawM()">${x.out?"🚫 Тугаган":"✅ Бор"}</button><button class="r" onclick="if(confirm('Ўчирайми?')){M.splice(${i},1);ch();drawM()}">🗑</button></div></div></div>`).join("")}
function ch(i,k,v){if(k)M[i][k]=v;dirty=true;$("sm").textContent="● Сақланмаган ўзгаришлар";$("sm").style.color="var(--saf)"}
function addM(){M.push({id:Math.max(0,...M.map(x=>x.id))+1,c:M.length?M[M.length-1].c:"Ош",n:"",d:"",p:0,img:"",out:false});ch();drawM();scrollTo(0,document.body.scrollHeight)}
async function saveM(){if(M.some(x=>!x.n.trim())){alert("Номи бўш таом бор");return}await api("menu",M);dirty=false;$("sm").textContent="✓ Сақланди";$("sm").style.color="var(--ok)"}
let pi=0;function pic(i){pi=i;$("fi").value="";$("fi").click()}
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);M[pi].img=c.toDataURL("image/jpeg",.78);ch();drawM()};im.src=URL.createObjectURL(f)};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
/* --- hisobot --- */
const day=()=>{$("rf").value=$("rt").value=ds(Date.now());rep()};
let RO=[];
async function rep(){const[f,t]=rng($("rf").value,$("rt").value);RO=(await api(`orders?from=${f}&to=${t}`)).reverse();
 const D=RO.filter(o=>o.s===3),X=RO.filter(o=>o.s===4),A=RO.filter(o=>o.s<3),sum=a=>a.reduce((n,o)=>n+o.total,0),food=D.reduce((n,o)=>n+o.sum,0),fee=D.reduce((n,o)=>n+o.fee,0);
 const it={};D.forEach(o=>o.items.forEach(i=>{const r=it[i.n]||(it[i.n]={q:0,s:0});r.q+=i.q;r.s+=i.q*i.p}));
 const per=$("rf").value===$("rt").value?$("rf").value:$("rf").value+" — "+$("rt").value;
 $("rp").innerHTML=`<div class="c"><div class="mu">Давр: ${per}</div><div class="mu" style="margin-top:6px">💰 КАССА (етказилган буюртмалар жами)</div><div class="big" style="color:var(--ok)">${fmt(sum(D))}</div><div class="mu">Таомлар ${fmt(food)} + етказиш ${fmt(fee)}</div></div>
${A.length?`<div class="c" style="border-color:var(--saf)">⚠️ <b>${A.length} та буюртма ҳали етказилмаган</b> (${fmt(sum(A))}). Улар кассага киритилмаган. Етказилди деб белгиланг ёки бекор қилинг.</div>`:""}
<div class="g4"><div class="c"><div class="mu">Жами буюртма</div><div class="big">${RO.length}</div></div><div class="c"><div class="mu">🏠 Етказилган</div><div class="big">${D.length}</div></div><div class="c"><div class="mu">❌ Бекор</div><div class="big">${X.length}</div><div class="mu">${fmt(sum(X))}</div></div><div class="c"><div class="mu">Ўртача чек</div><div class="big" style="font-size:20px">${D.length?fmt(sum(D)/D.length):"—"}</div></div></div>
<div class="c"><h3 style="margin:0 0 8px">Сотилган таомлар (етказилганлар)</h3><table><thead><tr><th>Таом</th><th class="n">Сони</th><th class="n">Сумма</th></tr></thead><tbody>${Object.entries(it).sort((a,b)=>b[1].s-a[1].s).map(([n,r])=>`<tr><td>${esc(n)}</td><td class="n">${r.q}</td><td class="n">${fmt(r.s)}</td></tr>`).join("")||'<tr><td colspan=3 class="mu">Йўқ</td></tr>'}</tbody><tfoot><tr><td>Жами таомлар</td><td class="n">${Object.values(it).reduce((n,r)=>n+r.q,0)}</td><td class="n">${fmt(food)}</td></tr></tfoot></table></div>
<div class="c"><h3 style="margin:0 0 8px">Барча буюртмалар</h3><table><thead><tr><th>№</th><th>Вақт</th><th>Мижоз</th><th>Ҳолат</th><th class="n">Сумма</th></tr></thead><tbody>${RO.map(o=>`<tr style="${o.s===4?"opacity:.5;text-decoration:line-through":""}"><td>${o.id}</td><td>${new Date(o.t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</td><td>${esc(o.name)}</td><td>${EM[o.s]}</td><td class="n">${fmt(o.total)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan=4>Касса (етказилган ${D.length} та)</td><td class="n">${fmt(sum(D))}</td></tr></tfoot></table></div>
<div class="row noprint"><button class="p" onclick="print()">🖨 Чоп этиш / PDF</button><button onclick="csv()">⬇ Excel (CSV)</button></div>`}
function csv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',h=["№","Сана","Вақт","Мижоз","Телефон","Манзил","Таомлар","Таомлар суммаси","Етказиш","Жами","Ҳолат"],r=RO.map(o=>[o.id,ds(o.t),new Date(o.t).toLocaleTimeString("ru-RU"),o.name,o.phone,o.address,o.items.map(i=>i.n+" x"+i.q).join("; "),o.sum,o.fee,o.total,ST[o.s]]);
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[h,...r].map(x=>x.map(q).join(";")).join("\n")],{type:"text/csv"}));a.download="hisobot-"+$("rf").value+".csv";a.click()}
if(TGD||PW)api("ping").then(start).catch(()=>{});
</script></body></html>
